<!DOCTYPE html>
<html>
<head>

    <title>TITAN AI</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app">

    <header>
        <div class="logo">🤖</div>

        <div>
            <h1>TITAN AI</h1>
            <span>● Online</span>
        </div>
    </header>


    <main id="chat">

        <div class="message bot">
            Hey! I'm TITAN. How can I help you?
        </div>

    </main>


    <footer>

        <input
            id="input"
            type="text"
            placeholder="Message TITAN..."
            autocomplete="off"
        >

        <button onclick="sendMessage()">
            ➤
        </button>

    </footer>

</div>


<script src="app.js"></script>

</body>
</html>
